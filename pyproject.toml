[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luad-uie"
version = "0.1.0"
description = "Research prototype for learning-utility-aware underwater enhancement"
requires-python = ">=3.8"
dependencies = ["torch>=2.1", "numpy>=1.24", "Pillow>=9", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["luad_uie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
